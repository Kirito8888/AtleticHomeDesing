# Actualizaciones de dependencias semanales. Cada PR pasa por la CI completa
# (incluidos los E2E), así que solo se fusiona lo que sigue funcionando.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Parches y menores juntos para no inundar de PRs; las mayores, una a una.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Mayores que exigen migración del código (rompen la CI) o que no encajan con el runtime:
      # se hacen a mano en una versión propia. TypeScript 7 y ESLint 10 cambian la configuración;
      # @types/node debe seguir a la versión de Node de la imagen (22).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
