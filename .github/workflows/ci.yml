name: CI

on:
  push:
    # main y las ramas de trabajo (se valida antes de abrir el PR)
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vulnerabilidades altas en dependencias de producción (las de desarrollo no llegan a la imagen).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sin DATABASE_URL ni secretos: el build no debe necesitarlos.
      - run: npm run build

  semgrep:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Reglas propias (.semgrep.yml): bloquean.
      - run: semgrep scan --config .semgrep.yml --error --metrics=off src prisma e2e
      # Reglas públicas: informe (no bloquea) para revisar hallazgos nuevos sin romper la CI por falsos positivos.
      - run: semgrep scan --config p/typescript --config p/react --config p/nextjs --config p/secrets --metrics=off --exclude src/generated src prisma || true

  e2e:
    name: E2E (UI + seguridad)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos?schema=public
      AUTH_SECRET: ci-only-not-a-secret
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      CHROMIUM_PATH: /usr/bin/google-chrome
      SCHEDULER_ENABLED: "false"
      # Clave solo para la CI (32 bytes en base64), no es un secreto real
      TOTP_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlcy1rZXktZm9yLXRvdHAhISE=
      # Claves VAPID solo para la CI (generadas para esto, sin valor fuera de los tests)
      VAPID_PUBLIC_KEY: BJ12Ybt-28O9IW2mu3X0U_6wCoqBaUTzVASwoOk8wWidqzWk5PnUV3Mi8lekFvqhStgSUNLj1X882CARKCPFPJg
      VAPID_PRIVATE_KEY: WR6TKd8X0HhDbnzMaiYLa1-Ye5SPRYYjarLHcVna1Is
      VAPID_SUBJECT: mailto:ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy && npx prisma db seed
      # Con DATABASE_URL se ejecutan también los tests de integración (*.int.test.ts: ingesta, pg-boss, push, extractos y plan importado)
      - run: npm test
      - run: npm run build
      - name: Preparar el servidor standalone
        run: cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
      - name: Smoke de la UI (registro abierto)
        run: |
          # LIFEOS_FAKE_AI=1: planes con IA simulados (la CI no tiene clave de Gemini)
          LIFEOS_FAKE_AI=1 ALLOW_REGISTRATION=true PORT=3000 node .next/standalone/server.js > server-open.log 2>&1 &
          SERVER=$!
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run e2e
          # Importar la planificación con PDF sintéticos (sin datos reales)
          npm run e2e:plan
          # v1.4: crear plan con IA, ciclo, ajustes del día y bloques A-E
          npm run e2e:v14
          # v1.5: salud de la mujer, entreno, estudio y plataforma
          npm run e2e:v15
          # v1.6: mujeres, fuerza, planificación, jabalina, salud, plataforma, nutrición, estudio y finanzas
          npm run e2e:v16
          npm run e2e:v17
          kill $SERVER
      # El smoke ya creó un usuario: con ALLOW_REGISTRATION=false el registro queda cerrado.
      - name: Seguridad (registro cerrado)
        run: |
          ALLOW_REGISTRATION=false PORT=3000 node .next/standalone/server.js > server-closed.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run e2e:security
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            server-*.log
            e2e/screenshots/

  docker:
    name: Stack Docker (healthcheck, copias y update.sh)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de prueba (.env.production efímero y clave age)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age postgresql-client
          age-keygen -o /tmp/age.key 2> /tmp/age.pub
          cat > .env.production <<EOF
          POSTGRES_USER=lifeos
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=lifeos
          PGADMIN_DEFAULT_EMAIL=ci@example.com
          PGADMIN_DEFAULT_PASSWORD=ci-password
          AUTH_SECRET=ci-only-not-a-secret
          AUTH_URL=http://localhost:3000
          BACKUP_AGE_RECIPIENT=$(grep -o 'age1[a-z0-9]*' /tmp/age.pub)
          BACKUP_ON_START=false
          EOF
      - name: Base de datos, migraciones y web (espera al healthcheck)
        run: |
          docker compose --env-file .env.production up -d --wait db
          docker compose --env-file .env.production --profile tools run --rm --build migrate
          docker compose --env-file .env.production --profile tools run --rm migrate npm run user -- create ci@example.com
          docker compose --env-file .env.production up -d --build --wait web
          curl -sf http://127.0.0.1:3000/api/health
      - name: Vulnerabilidades de la imagen (Trivy) y lista de componentes (SBOM)
        run: |
          # Imagen de Trivy fijada por versión (sin acciones de terceros en la cadena de suministro).
          # Falla con fallos ALTOS o CRÍTICOS que ya tienen arreglo publicado.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress lifeos-web:latest
          npm sbom --package-lock-only --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Copia cifrada y restauración real
        run: |
          docker compose --env-file .env.production --profile backup run --rm --build backup /usr/local/bin/backup.sh
          sudo age -d -i /tmp/age.key backups/db-*.dump.age > /tmp/db.dump
          docker compose --env-file .env.production exec -T db createdb -U lifeos restored
          docker compose --env-file .env.production exec -T db pg_restore -U lifeos --no-owner -d restored < /tmp/db.dump
          users=$(docker compose --env-file .env.production exec -T db psql -U lifeos -d restored -tAc 'select count(*) from "User"')
          test "$users" = "1"
      - name: update.sh (actualización, contenedor huérfano y vuelta atrás forzada)
        run: |
          # Un resto de una recreación interrumpida (el caso real de la v1.6): mismo servicio, otro nombre
          docker create --name deadbeef0001_lifeos-web-1 \
            --label com.docker.compose.project=lifeos --label com.docker.compose.service=web \
            --label com.docker.compose.container-number=1 --label com.docker.compose.oneoff=False \
            lifeos-web:latest
          ./scripts/update.sh --no-pull
          test "$(docker ps -aq --filter label=com.docker.compose.project=lifeos --filter label=com.docker.compose.service=web | wc -l)" = "1"
          # Endurecimiento aplicado: solo lectura, sin capacidades y con límite de memoria
          id=$(docker compose --env-file .env.production ps -q web)
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" != "0"
          docker inspect -f '{{.HostConfig.CapDrop}}' "$id" | grep -qi all
          curl -sI http://127.0.0.1:3000/login | grep -qi "cross-origin-resource-policy: same-origin"
          if LIFEOS_SIMULATE_UNHEALTHY=1 UPDATE_HEALTH_TIMEOUT=30 ./scripts/update.sh --no-pull; then
            echo "la vuelta atrás debía terminar con error"; exit 1
          fi
          id=$(docker compose --env-file .env.production ps -q web)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = "healthy"
      - if: failure()
        run: docker compose --env-file .env.production logs --tail=200
