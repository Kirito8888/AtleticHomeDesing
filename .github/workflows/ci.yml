name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sin DATABASE_URL ni secretos: el build no debe necesitarlos.
      - run: npm run build

  e2e:
    name: E2E (UI + seguridad)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos?schema=public
      AUTH_SECRET: ci-only-not-a-secret
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      CHROMIUM_PATH: /usr/bin/google-chrome
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run build
      - name: Preparar el servidor standalone
        run: cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
      - name: Smoke de la UI (registro abierto)
        run: |
          ALLOW_REGISTRATION=true PORT=3000 node .next/standalone/server.js > server-open.log 2>&1 &
          SERVER=$!
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run e2e
          kill $SERVER
      # El smoke ya creó un usuario: con ALLOW_REGISTRATION=false el registro queda cerrado.
      - name: Seguridad (registro cerrado)
        run: |
          ALLOW_REGISTRATION=false PORT=3000 node .next/standalone/server.js > server-closed.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run e2e:security
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            server-*.log
            e2e/screenshots/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runner y migrate
        run: |
          docker buildx build --target runner -t lifeos-web:ci .
          docker buildx build --target migrate -t lifeos-migrate:ci .
