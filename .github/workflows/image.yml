name: Imagen

# Compila las imágenes Docker en CI y las publica en GHCR para que el servidor haga `pull`
# en vez de compilar (scripts/update.sh). Sin secretos: usa el GITHUB_TOKEN nativo.
# La imagen NO lleva configuración: .dockerignore excluye .env* y `next build` no necesita
# DATABASE_URL ni claves (lo comprueba el job «check» de ci.yml); la configuración real
# se inyecta en ejecución con env_file en el servidor.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Compilar y publicar en GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # GHCR exige el nombre en minúsculas.
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Web (runner). Etiquetas: sha-<commit completo> (lo que pide update.sh) y latest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # Herramienta de migraciones (target migrate).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE }}-migrate:sha-${{ github.sha }}
            ${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
