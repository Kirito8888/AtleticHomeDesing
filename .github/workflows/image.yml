name: Imagen

# Compila las imágenes Docker en CI y las publica en GHCR para que el servidor haga `pull`
# en vez de compilar (scripts/update.sh). Sin secretos: usa el GITHUB_TOKEN nativo.
# La imagen NO lleva configuración: .dockerignore excluye .env* y `next build` no necesita
# DATABASE_URL ni claves (lo comprueba el job «check» de ci.yml); la configuración real
# se inyecta en ejecución con env_file en el servidor.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Compilar y publicar en GHCR
    runs-on: ubuntu-24.04
    # Solo este job escribe paquetes (mínimo privilegio).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # GHCR exige el nombre en minúsculas.
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Web (runner). Etiquetas: sha-<commit completo> (lo que pide update.sh) y latest.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # Herramienta de migraciones (target migrate).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE }}-migrate:sha-${{ github.sha }}
            ${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
